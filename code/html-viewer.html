<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>HTML Viewer - Runtide</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Fira Code', monospace;
            background: #1e1e1e;
            color: #e0e0e0;
            height: 100vh;
            overflow: hidden;
        }

        body.light-mode {
            background: #ffffff;
            color: #333;
        }

        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 12px 20px;
            background: #252526;
            border-bottom: 1px solid #3e3e42;
        }

        body.light-mode .header {
            background: #f3f3f3;
            border-bottom-color: #e0e0e0;
        }

        .logo {
            font-size: 1.5rem;
            font-weight: bold;
            color: #00d9ff;
            cursor: pointer;
        }

        .controls {
            display: flex;
            gap: 15px;
        }

        .theme-toggle {
            padding: 8px 12px;
            background: #007acc;
            color: white;
            border: none;
            border-radius: 4px;
            cursor: pointer;
            font-size: 1rem;
        }

        .theme-toggle:hover {
            background: #005a9e;
        }

        .container {
            display: flex;
            height: calc(100vh - 50px);
            gap: 10px;
            padding: 10px;
        }

        .editor-section {
            flex: 1;
            display: flex;
            flex-direction: column;
            background: #252526;
            border-radius: 6px;
            overflow: hidden;
        }

        body.light-mode .editor-section {
            background: #f5f5f5;
        }

        .label {
            padding: 8px 12px;
            background: #1e1e1e;
            font-size: 0.85rem;
            font-weight: bold;
            color: #00d9ff;
            border-bottom: 1px solid #3e3e42;
        }

        body.light-mode .label {
            background: #e8e8e8;
            border-bottom-color: #d0d0d0;
        }

        textarea {
            flex: 1;
            padding: 12px;
            background: #1e1e1e;
            color: #d4d4d4;
            border: none;
            font-family: 'Fira Code', monospace;
            font-size: 13px;
            line-height: 1.6;
            resize: none;
            overflow-y: auto;
        }

        body.light-mode textarea {
            background: #fafafa;
            color: #333;
        }

        textarea:focus {
            outline: none;
            background: #252526;
        }

        body.light-mode textarea:focus {
            background: #f0f0f0;
        }

        .preview-section {
            flex: 1;
            display: flex;
            flex-direction: column;
            background: #252526;
            border-radius: 6px;
            overflow: hidden;
        }

        body.light-mode .preview-section {
            background: #f5f5f5;
        }

        #preview {
            flex: 1;
            border: none;
            background: white;
            overflow: auto;
        }

        ::-webkit-scrollbar {
            width: 10px;
        }

        ::-webkit-scrollbar-track {
            background: #1e1e1e;
        }

        body.light-mode ::-webkit-scrollbar-track {
            background: #f5f5f5;
        }

        ::-webkit-scrollbar-thumb {
            background: #464647;
            border-radius: 5px;
        }

        ::-webkit-scrollbar-thumb:hover {
            background: #5a5a5a;
        }
    </style>
</head>
<body>
    <div class="header">
        <div class="logo" onclick="window.location.href='/'">🌊 Runtide</div>
        <div class="controls">
            <button class="theme-toggle" id="themeToggle">🌙</button>
        </div>
    </div>

    <div class="container">
        <div class="editor-section">
            <div class="label">HTML</div>
            <textarea id="htmlCode" placeholder="Write your HTML here..."></textarea>
        </div>

        <div class="preview-section">
            <div class="label">Preview</div>
            <iframe id="preview"></iframe>
        </div>
    </div>

    <script>
        const htmlCode = document.getElementById('htmlCode');
        const preview = document.getElementById('preview');
        const themeToggle = document.getElementById('themeToggle');

        function loadCode() {
            localStorage.removeItem('runtide_html_viewer');
            htmlCode.value = '';
            const theme = localStorage.getItem('runtide_theme') || 'dark';
            if (theme === 'light') {
                document.body.classList.add('light-mode');
                themeToggle.textContent = '☀️';
            }
        }

        function saveCode() {
            localStorage.setItem('runtide_html_viewer', htmlCode.value);
        }

        function updatePreview() {
            const html = htmlCode.value;
            const combined = `
                <!DOCTYPE html>
                <html>
                <head>
                    <meta charset="UTF-8">
                    <meta name="viewport" content="width=device-width, initial-scale=1.0">
                </head>
                <body>
                    ${html}
                </body>
                </html>
            `;
            preview.srcdoc = combined;
            saveCode();
        }

        htmlCode.addEventListener('input', updatePreview);

        themeToggle.addEventListener('click', () => {
            document.body.classList.toggle('light-mode');
            themeToggle.textContent = document.body.classList.contains('light-mode') ? '☀️' : '🌙';
            localStorage.setItem('runtide_theme', document.body.classList.contains('light-mode') ? 'light' : 'dark');
        });

        loadCode();
        updatePreview();
    </script>
</body>
</html>
