<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Runtide — Python Playground</title>
  <!-- Load Pyodide from CDN -->
  <script src="https://cdn.jsdelivr.net/pyodide/v0.26.4/full/pyodide.js"></script>
  <style>
    :root {
      --bg: #0b0e14;
      --surface: #131822;
      --surface-hover: #1b2230;
      --border: #252e3f;
      --text: #e6edf3;
      --text-muted: #8b949e;
      --accent: #3b82f6;
      --accent-hover: #2563eb;
      --success: #22c55e;
      --error: #f87171;
      --font-mono: 'Fira Code', 'JetBrains Mono', ui-monospace, SFMono-Regular, Menlo, monospace;
      --font-sans: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      background-color: var(--bg);
      color: var(--text);
      font-family: var(--font-sans);
      height: 100vh;
      display: flex;
      flex-direction: column;
    }

    /* Top Navigation / Toolbar */
    header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0.75rem 1.25rem;
      background-color: var(--surface);
      border-bottom: 1px solid var(--border);
      gap: 0.75rem;
      flex-wrap: wrap;
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 0.6rem;
      font-weight: 700;
      font-size: 1.05rem;
    }

    .badge {
      font-size: 0.72rem;
      font-weight: 600;
      padding: 0.15rem 0.5rem;
      border-radius: 999px;
      background: rgba(59, 130, 246, 0.15);
      color: #60a5fa;
      border: 1px solid rgba(59, 130, 246, 0.3);
    }

    .controls {
      display: flex;
      align-items: center;
      gap: 0.6rem;
    }

    select, button {
      font-family: var(--font-sans);
      font-size: 0.875rem;
      border-radius: 6px;
      border: 1px solid var(--border);
      padding: 0.45rem 0.85rem;
      cursor: pointer;
      transition: all 0.15s ease;
    }

    select {
      background-color: var(--bg);
      color: var(--text);
    }

    select:hover {
      border-color: var(--text-muted);
    }

    .btn-secondary {
      background-color: var(--surface-hover);
      color: var(--text);
    }

    .btn-secondary:hover {
      background-color: #263042;
    }

    .btn-run {
      background-color: var(--accent);
      border-color: var(--accent);
      color: #fff;
      font-weight: 600;
      display: flex;
      align-items: center;
      gap: 0.4rem;
    }

    .btn-run:hover:not(:disabled) {
      background-color: var(--accent-hover);
    }

    .btn-run:disabled {
      opacity: 0.55;
      cursor: not-allowed;
    }

    /* Main Split Workspace */
    main {
      flex: 1;
      display: grid;
      grid-template-columns: 1fr 1fr;
      overflow: hidden;
    }

    .pane {
      display: flex;
      flex-direction: column;
      height: 100%;
      overflow: hidden;
    }

    .pane:first-child {
      border-right: 1px solid var(--border);
    }

    .pane-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 0.5rem 1rem;
      background-color: var(--surface);
      border-bottom: 1px solid var(--border);
      font-size: 0.78rem;
      text-transform: uppercase;
      letter-spacing: 0.05em;
      color: var(--text-muted);
    }

    #editor {
      flex: 1;
      width: 100%;
      background-color: var(--bg);
      color: var(--text);
      font-family: var(--font-mono);
      font-size: 0.95rem;
      line-height: 1.6;
      padding: 1rem;
      border: none;
      outline: none;
      resize: none;
      tab-size: 4;
    }

    #output {
      flex: 1;
      padding: 1rem;
      font-family: var(--font-mono);
      font-size: 0.9rem;
      line-height: 1.55;
      overflow-y: auto;
      white-space: pre-wrap;
      word-break: break-word;
    }
