<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Python IDE — Runtide</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.16/codemirror.min.css">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.16/theme/material-darker.min.css">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.16/theme/eclipse.min.css">
<style>
:root{--bg:#1e1e1e;--panel:#252526;--panel2:#2d2d30;--border:#3e3e42;--text:#e0e0e0;--muted:#9da5b4;--blue:#007acc;--cyan:#00d9ff}
*{box-sizing:border-box}body{margin:0;height:100vh;overflow:hidden;background:var(--bg);color:var(--text);font:14px 'Segoe UI',sans-serif;display:flex;flex-direction:column}
body.light{--bg:#fff;--panel:#f5f5f5;--panel2:#e8e8e8;--border:#d0d0d0;--text:#333;--muted:#777}
.top{height:56px;display:flex;align-items:center;justify-content:space-between;padding:0 18px;background:var(--panel);border-bottom:1px solid var(--border);flex-shrink:0}
.brand{font-weight:800;font-size:19px;color:var(--cyan);cursor:pointer}.top-actions{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
button{background:var(--panel2);color:var(--text);border:1px solid var(--border);border-radius:5px;padding:8px 11px;cursor:pointer;font-weight:600}button:hover{border-color:var(--blue)}button.primary{background:var(--blue);color:white;border-color:var(--blue)}button:disabled{opacity:.5}
.layout{display:grid;grid-template-columns:240px minmax(0,1fr);flex:1;min-height:0}
.explorer{background:var(--panel);border-right:1px solid var(--border);display:flex;flex-direction:column;min-width:0}
.explorer-title{display:flex;justify-content:space-between;align-items:center;padding:13px 12px;border-bottom:1px solid var(--border);font-weight:700;font-size:12px;letter-spacing:.4px;text-transform:uppercase}
.filelist{padding:7px;overflow:auto;flex:1}.fileitem{display:flex;align-items:center;gap:8px;padding:9px 8px;border-radius:4px;cursor:pointer;word-break:break-word}.fileitem:hover{background:var(--panel2)}.fileitem.active{background:rgba(0,122,204,.18);color:var(--cyan)}.fileitem .fname{flex:1}.fileitem .del{padding:2px 6px;border:none;background:transparent;color:var(--muted)}
.addfile{margin:8px}.workspace{display:flex;flex-direction:column;min-width:0;min-height:0}
.tabs{display:flex;background:var(--panel);border-bottom:1px solid var(--border);min-height:38px;overflow:auto}.tab{padding:10px 14px;border-right:1px solid var(--border);cursor:pointer;white-space:nowrap;color:var(--muted)}.tab.active{background:var(--bg);color:var(--text);border-bottom:2px solid var(--blue)}
.editarea{flex:1;min-height:0;position:relative}.CodeMirror{height:100%;font:14px/1.6 'Fira Code',monospace}.CodeMirror-gutters{background:var(--panel);border-right:1px solid var(--border)}
.outputarea{height:220px;min-height:120px;max-height:45vh;display:flex;flex-direction:column;border-top:1px solid var(--border);background:var(--bg)}
.outputhead{display:flex;justify-content:space-between;padding:9px 12px;background:var(--panel);border-bottom:1px solid var(--border);font-size:12px)}.output{padding:12px;overflow:auto;flex:1;white-space:pre-wrap;font:12px/1.6 monospace}.output .err{color:#ff7070}.output .ok{color:#66d9a4}.statusbar{padding:6px 12px;background:var(--panel);border-top:1px solid var(--border);color:var(--muted);font-size:11px;display:flex;justify-content:space-between}
@media(max-width:700px){.layout{grid-template-columns:155px minmax(0,1fr)}.top{height:auto;min-height:54px;padding:8px}.top-actions button{padding:7px;font-size:12px}.outputarea{height:180px}.brand{font-size:16px}}
</style></head>
<body>
<header class="top"><div class="brand" onclick="location.href='/index.html'">🌊 Runtide <small style="font-size:11px;color:var(--muted);font-weight:400">Python IDE</small></div><div class="top-actions"><span id="runtimeStatus" style="font-size:11px;color:var(--muted)">Loading Python…</span><button id="themeBtn">🌙</button><button id="zipBtn">Download ZIP</button><button id="runBtn" class="primary">▶ Run</button></div></header>
<div class="layout"><aside class="explorer"><div class="explorer-title">Explorer <button id="newFileBtn" title="New file">＋</button></div><div id="filelist" class="filelist"></div><button class="addfile" id="newFileBottom">＋ New file</button></aside>
<section class="workspace"><div id="tabs" class="tabs"></div><div class="editarea"><textarea id="editor"></textarea></div><div class="outputarea"><div class="outputhead"><span>Terminal / Output</span><button id="clearOutput">Clear</button></div><div id="output" class="output"></div><div class="statusbar"><span id="statusText">Ready</span><span>Python 3 · Browser runtime</span></div></div></section></div>
<script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.16/codemirror.min.js"></script><script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.16/mode/python/python.min.js"></script><script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.16/addon/edit/matchbrackets.min.js"></script><script src="https://cdn.jsdelivr.net/pyodide/v0.27.7/full/pyodide.js"></script><script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>
<script>
const STORE='runtide_python_ide_v1';let files={},active='main.py',pyodide=null,runBusy=false;
const defaultCode='# Welcome to Runtide Python IDE!\\nprint("Hello from Python!")\\n';
try{const saved=JSON.parse(localStorage.getItem(STORE)||'null');if(saved&&saved.files){files=saved.files;active=saved.active||Object.keys(files)[0]}else files={'main.py':defaultCode}}catch{files={'main.py':defaultCode}}
if(!files[active])active=Object.keys(files)[0]||'main.py';if(!files[active])files[active]=defaultCode;
const editor=CodeMirror.fromTextArea(document.getElementById('editor'),{mode:'python',theme:localStorage.getItem('runtide_theme')==='light'?'eclipse':'material-darker',lineNumbers:true,indentUnit:4,tabSize:4,matchBrackets:true,viewportMargin:Infinity});
const list=document.getElementById('filelist'),tabs=document.getElementById('tabs'),output=document.getElementById('output');
function save(){files[active]=editor.getValue();try{localStorage.setItem(STORE,JSON.stringify({files,active}))}catch{}}
function renderFiles(){list.innerHTML='';tabs.innerHTML='';Object.keys(files).forEach(name=>{const el=document.createElement('div');el.className='fileitem'+(name===active?' active':'');el.innerHTML='<span>🐍</span><span class="fname"></span><button class="del" title="Delete file">×</button>';el.querySelector('.fname').textContent=name;el.onclick=(e)=>{if(e.target.closest('.del'))return;switchFile(name)};el.querySelector('.del').onclick=e=>{e.stopPropagation();deleteFile(name)};list.appendChild(el);const tab=document.createElement('div');tab.className='tab'+(name===active?' active':'');tab.textContent=name;tab.onclick=()=>switchFile(name);tabs.appendChild(tab)})}
function switchFile(name){save();active=name;editor.setValue(files[name]||'');editor.clearHistory();renderFiles()}
function addFile(){let name=prompt('File name (example: helpers.py):');if(!name)return;name=name.trim();if(!name||name.includes('/')||name.includes('\\')||files[name]){alert('Please enter a unique file name (no folders).');return}save();files[name]='';active=name;editor.setValue('');renderFiles();editor.focus()}
function deleteFile(name){if(Object.keys(files).length<=1){alert('Keep at least one file in the project.');return}if(!confirm('Delete '+name+'?'))return;save();delete files[name];active=Object.keys(files)[0];editor.setValue(files[active]);renderFiles()}
editor.on('change',save);renderFiles();editor.setValue(files[active]||'');
document.getElementById('newFileBtn').onclick=addFile;document.getElementById('newFileBottom').onclick=addFile;
function log(msg,cls=''){const line=document.createElement('div');if(cls)line.className=cls;line.textContent=msg;output.appendChild(line);output.scrollTop=output.scrollHeight}
document.getElementById('clearOutput').onclick=()=>output.innerHTML='';
async function boot(){try{pyodide=await loadPyodide();document.getElementById('runtimeStatus').textContent='Python ready';document.getElementById('statusText').textContent='Runtime loaded';log('Python runtime is ready.','ok')}catch(e){document.getElementById('runtimeStatus').textContent='Runtime unavailable';log('Could not load Python runtime: '+e,'err'}}
boot();
document.getElementById('runBtn').onclick=async()=>{if(!pyodide||runBusy)return;save();runBusy=true;const btn=document.getElementById('runBtn');btn.disabled=true;document.getElementById('statusText').textContent='Running';output.innerHTML='';try{pyodide.setStdout({batched:s=>log(s)});pyodide.setStderr({batched:s=>log(s,'err')});pyodide.runPython('import sys\\nfrom js import prompt\\nclass _InputProxy:\\n def __call__(self, prompt_text=""):\\n  return prompt(str(prompt_text))\\ninput=_InputProxy()');pyodide.runPython(editor.getValue());log('Finished.','ok');document.getElementById('statusText').textContent='Finished'}catch(e){log(String(e),'err');document.getElementById('statusText').textContent='Error'}finally{runBusy=false;btn.disabled=false}};
document.getElementById('themeBtn').onclick=()=>{const light=document.body.classList.toggle('light');localStorage.setItem('runtide_theme',light?'light':'dark');editor.setOption('theme',light?'eclipse':'material-darker');document.getElementById('themeBtn').textContent=light?'☀️':'🌙'};
if(localStorage.getItem('runtide_theme')==='light'){document.body.classList.add('light');editor.setOption('theme','eclipse');document.getElementById('themeBtn').textContent='☀️'}
document.getElementById('zipBtn').onclick=async()=>{save();if(!window.JSZip){alert('ZIP library is still loading.');return}const zip=new JSZip();Object.entries(files).forEach(([n,c])=>zip.file(n,c));zip.file('README.txt','Runtide Python IDE project\\nOpen main.py in a Python environment.');const blob=await zip.generateAsync({type:'blob'});const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='runtide-python-project.zip';a.click();setTimeout(()=>URL.revokeObjectURL(a.href),1000)};
editor.setOption('extraKeys',{'Ctrl-Enter':()=>document.getElementById('runBtn').click(),'Cmd-Enter':()=>document.getElementById('runBtn').click()});
</script></body></html>
