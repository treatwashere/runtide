<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Playground - Runtide</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Fira Code', 'Monaco', monospace;
            background: #1e1e1e;
            color: #e0e0e0;
            height: 100vh;
            overflow: hidden;
        }

        body.light-mode {
            background: #ffffff;
            color: #333;
        }

        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 12px 20px;
            background: #252526;
            border-bottom: 1px solid #3e3e42;
            z-index: 100;
        }

        body.light-mode .header {
            background: #f3f3f3;
            border-bottom-color: #e0e0e0;
        }

        .logo {
            font-size: 1.5rem;
            font-weight: bold;
            color: #00d9ff;
            cursor: pointer;
        }

        .controls {
            display: flex;
            gap: 15px;
            align-items: center;
        }

        .responsive-btn {
            padding: 6px 12px;
            background: #007acc;
            color: white;
            border: none;
            border-radius: 4px;
            cursor: pointer;
            font-size: 0.85rem;
            transition: all 0.2s;
        }

        .responsive-btn:hover {
            background: #005a9e;
        }

        .responsive-btn.active {
            background: #00d9ff;
            color: #1e1e1e;
        }

        .theme-toggle {
            padding: 8px 12px;
            background: #007acc;
            color: white;
            border: none;
            border-radius: 4px;
            cursor: pointer;
            font-size: 1rem;
            transition: all 0.2s;
        }

        .theme-toggle:hover {
            background: #005a9e;
        }

        .container {
            display: flex;
            height: calc(100vh - 50px);
            gap: 10px;
            padding: 10px;
        }

        .editors {
            flex: 1;
            display: flex;
            flex-direction: column;
            gap: 10px;
            overflow: hidden;
        }

        .editor-group {
            flex: 1;
            display: flex;
            flex-direction: column;
            background: #252526;
            border-radius: 6px;
            overflow: hidden;
        }

        body.light-mode .editor-group {
            background: #f5f5f5;
        }

        .editor-label {
            padding: 8px 12px;
            background: #1e1e1e;
            font-size: 0.85rem;
            font-weight: bold;
            color: #00d9ff;
            border-bottom: 1px solid #3e3e42;
        }

        body.light-mode .editor-label {
            background: #e8e8e8;
            border-bottom-color: #d0d0d0;
        }

        textarea {
            flex: 1;
            padding: 12px;
            background: #1e1e1e;
            color: #d4d4d4;
            border: none;
            font-family: 'Fira Code', monospace;
            font-size: 13px;
            line-height: 1.6;
            resize: none;
            overflow-y: auto;
        }

        body.light-mode textarea {
            background: #fafafa;
            color: #333;
        }

        textarea:focus {
            outline: none;
            background: #252526;
        }

        body.light-mode textarea:focus {
            background: #f0f0f0;
        }

        .preview {
            flex: 1;
            display: flex;
            flex-direction: column;
            background: #252526;
            border-radius: 6px;
            overflow: hidden;
        }

        body.light-mode .preview {
            background: #f5f5f5;
        }

        .preview-label {
            padding: 8px 12px;
            background: #1e1e1e;
            font-size: 0.85rem;
            font-weight: bold;
            color: #00d9ff;
            border-bottom: 1px solid #3e3e42;
        }

        body.light-mode .preview-label {
            background: #e8e8e8;
            border-bottom-color: #d0d0d0;
        }

        #preview {
            flex: 1;
            border: none;
            background: white;
            overflow: auto;
        }

        @media (max-width: 1200px) {
            .container {
                flex-direction: column;
            }

            .editors {
                flex-direction: row;
            }

            .editor-group {
                min-height: 150px;
            }
        }

        ::-webkit-scrollbar {
            width: 10px;
            height: 10px;
        }

        ::-webkit-scrollbar-track {
            background: #1e1e1e;
        }

        body.light-mode ::-webkit-scrollbar-track {
            background: #f5f5f5;
        }

        ::-webkit-scrollbar-thumb {
            background: #464647;
            border-radius: 5px;
        }

        ::-webkit-scrollbar-thumb:hover {
            background: #5a5a5a;
        }
    </style>
</head>
<body>
    <div class="header">
        <div class="logo" onclick="window.location.href='/'">🌊 Runtide</div>
        <div class="controls">
            <button class="responsive-btn active" data-size="desktop">Desktop</button>
            <button class="responsive-btn" data-size="tablet">Tablet</button>
            <button class="responsive-btn" data-size="mobile">Mobile</button>
            <button class="theme-toggle" id="themeToggle">🌙</button>
        </div>
    </div>

    <div class="container">
        <div class="editors">
            <div class="editor-group">
                <div class="editor-label">HTML</div>
                <textarea id="htmlCode" placeholder="Write your HTML here..."></textarea>
            </div>
            <div class="editor-group">
                <div class="editor-label">CSS</div>
                <textarea id="cssCode" placeholder="Write your CSS here..."></textarea>
            </div>
            <div class="editor-group">
                <div class="editor-label">JavaScript</div>
                <textarea id="jsCode" placeholder="Write your JavaScript here..."></textarea>
            </div>
        </div>

        <div class="preview">
            <div class="preview-label">Preview</div>
            <iframe id="preview"></iframe>
        </div>
    </div>

    <script>
        const htmlCode = document.getElementById('htmlCode');
        const cssCode = document.getElementById('cssCode');
        const jsCode = document.getElementById('jsCode');
        const preview = document.getElementById('preview');
        const themeToggle = document.getElementById('themeToggle');
        const responsiveButtons = document.querySelectorAll('.responsive-btn');

        function loadCode() {
            htmlCode.value = localStorage.getItem('runtide_playground_html') || '';
            cssCode.value = localStorage.getItem('runtide_playground_css') || '';
            jsCode.value = localStorage.getItem('runtide_playground_js') || '';
            const theme = localStorage.getItem('runtide_theme') || 'dark';
            if (theme === 'light') {
                document.body.classList.add('light-mode');
                themeToggle.textContent = '☀️';
            }
        }

        function saveCode() {
            localStorage.setItem('runtide_playground_html', htmlCode.value);
            localStorage.setItem('runtide_playground_css', cssCode.value);
            localStorage.setItem('runtide_playground_js', jsCode.value);
        }

        function updatePreview() {
            const html = htmlCode.value;
            const css = `<style>${cssCode.value}</style>`;
            const js = `<script>${jsCode.value}<\/script>`;
            
            const combined = `
                <!DOCTYPE html>
                <html>
                <head>
                    <meta charset="UTF-8">
                    <meta name="viewport" content="width=device-width, initial-scale=1.0">
                    ${css}
                </head>
                <body>
                    ${html}
                    ${js}
                </body>
                </html>
            `;

            preview.srcdoc = combined;
            saveCode();
        }

        htmlCode.addEventListener('input', updatePreview);
        cssCode.addEventListener('input', updatePreview);
        jsCode.addEventListener('input', updatePreview);

        themeToggle.addEventListener('click', () => {
            document.body.classList.toggle('light-mode');
            themeToggle.textContent = document.body.classList.contains('light-mode') ? '☀️' : '🌙';
            localStorage.setItem('runtide_theme', document.body.classList.contains('light-mode') ? 'light' : 'dark');
        });

        responsiveButtons.forEach(btn => {
            btn.addEventListener('click', () => {
                responsiveButtons.forEach(b => b.classList.remove('active'));
                btn.classList.add('active');

                const size = btn.dataset.size;
                switch(size) {
                    case 'mobile':
                        preview.style.width = '375px';
                        preview.style.margin = '0 auto';
                        break;
                    case 'tablet':
                        preview.style.width = '768px';
                        preview.style.margin = '0 auto';
                        break;
                    case 'desktop':
                    default:
                        preview.style.width = '100%';
                        preview.style.margin = '0';
                }
            });
        });

        loadCode();
        updatePreview();
    </script>
</body>
</html>
