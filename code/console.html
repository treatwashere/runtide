<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Console - Runtide</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Fira Code', monospace;
            background: #1e1e1e;
            color: #e0e0e0;
            height: 100vh;
            display: flex;
            flex-direction: column;
        }

        body.light-mode {
            background: #ffffff;
            color: #333;
        }

        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 12px 20px;
            background: #252526;
            border-bottom: 1px solid #3e3e42;
        }

        body.light-mode .header {
            background: #f3f3f3;
            border-bottom-color: #e0e0e0;
        }

        .logo {
            font-size: 1.5rem;
            font-weight: bold;
            color: #00d9ff;
            cursor: pointer;
        }

        .theme-toggle {
            padding: 8px 12px;
            background: #007acc;
            color: white;
            border: none;
            border-radius: 4px;
            cursor: pointer;
            font-size: 1rem;
        }

        .theme-toggle:hover {
            background: #005a9e;
        }

        .container {
            display: flex;
            flex: 1;
            gap: 10px;
            padding: 10px;
            overflow: hidden;
        }

        .code-section {
            flex: 1;
            display: flex;
            flex-direction: column;
            background: #252526;
            border-radius: 6px;
            overflow: hidden;
        }

        body.light-mode .code-section {
            background: #f5f5f5;
        }

        .label {
            padding: 8px 12px;
            background: #1e1e1e;
            font-size: 0.85rem;
            font-weight: bold;
            color: #00d9ff;
            border-bottom: 1px solid #3e3e42;
        }

        body.light-mode .label {
            background: #e8e8e8;
            border-bottom-color: #d0d0d0;
        }

        textarea {
            flex: 1;
            padding: 12px;
            background: #1e1e1e;
            color: #d4d4d4;
            border: none;
            font-family: 'Fira Code', monospace;
            font-size: 13px;
            line-height: 1.6;
            resize: none;
            overflow-y: auto;
        }

        body.light-mode textarea {
            background: #fafafa;
            color: #333;
        }

        textarea:focus {
            outline: none;
            background: #252526;
        }

        body.light-mode textarea:focus {
            background: #f0f0f0;
        }

        .output-section {
            flex: 1;
            display: flex;
            flex-direction: column;
            background: #252526;
            border-radius: 6px;
            overflow: hidden;
        }

        body.light-mode .output-section {
            background: #f5f5f5;
        }

        #output {
            flex: 1;
            padding: 12px;
            background: #1e1e1e;
            color: #d4d4d4;
            overflow-y: auto;
            font-size: 13px;
            line-height: 1.6;
            white-space: pre-wrap;
            word-wrap: break-word;
        }

        body.light-mode #output {
            background: #fafafa;
            color: #333;
        }

        .input-section {
            padding: 12px;
            background: #252526;
            border-top: 1px solid #3e3e42;
            display: flex;
            gap: 10px;
        }

        body.light-mode .input-section {
            background: #f5f5f5;
            border-top-color: #d0d0d0;
        }

        #codeInput {
            flex: 1;
            padding: 8px 12px;
            background: #1e1e1e;
            color: #d4d4d4;
            border: 1px solid #3e3e42;
            border-radius: 4px;
            font-family: 'Fira Code', monospace;
            font-size: 13px;
        }

        body.light-mode #codeInput {
            background: #fafafa;
            color: #333;
            border-color: #d0d0d0;
        }

        #codeInput:focus {
            outline: none;
            border-color: #007acc;
        }

        .run-btn {
            padding: 8px 20px;
            background: #007acc;
            color: white;
            border: none;
            border-radius: 4px;
            cursor: pointer;
            font-weight: bold;
            transition: all 0.2s;
        }

        .run-btn:hover {
            background: #005a9e;
        }

        .clear-btn {
            padding: 8px 20px;
            background: #666;
            color: white;
            border: none;
            border-radius: 4px;
            cursor: pointer;
            font-weight: bold;
            transition: all 0.2s;
        }

        .clear-btn:hover {
            background: #888;
        }

        .output-info {
            color: #808080;
        }

        .output-error {
            color: #f48771;
        }

        .output-log {
            color: #4ec9b0;
        }

        ::-webkit-scrollbar {
            width: 10px;
        }

        ::-webkit-scrollbar-track {
            background: #1e1e1e;
        }

        body.light-mode ::-webkit-scrollbar-track {
            background: #f5f5f5;
        }

        ::-webkit-scrollbar-thumb {
            background: #464647;
            border-radius: 5px;
        }

        ::-webkit-scrollbar-thumb:hover {
            background: #5a5a5a;
        }
    </style>
</head>
<body>
    <div class="header">
        <div class="logo" onclick="window.location.href='/'">🌊 Runtide</div>
        <button class="theme-toggle" id="themeToggle">🌙</button>
    </div>

    <div class="container">
        <div class="code-section">
            <div class="label">JavaScript Code</div>
            <textarea id="codeEditor" placeholder="Write your JavaScript code here...
Example: a = 5; b = 10; console.log(a + b)"></textarea>
        </div>

        <div class="output-section">
            <div class="label">Console Output</div>
            <div id="output"></div>
            <div class="input-section">
                <input type="text" id="codeInput" placeholder="Or type single line code here and press Enter...">
                <button class="run-btn" id="runBtn">Run</button>
                <button class="clear-btn" id="clearBtn">Clear</button>
            </div>
        </div>
    </div>

    <script>
        const codeEditor = document.getElementById('codeEditor');
        const codeInput = document.getElementById('codeInput');
        const output = document.getElementById('output');
        const runBtn = document.getElementById('runBtn');
        const clearBtn = document.getElementById('clearBtn');
        const themeToggle = document.getElementById('themeToggle');

        // Override console.log
        const originalLog = console.log;
        const originalError = console.error;

        let outputLines = [];

        function addOutput(message, type = 'log') {
            const timestamp = new Date().toLocaleTimeString();
            let className = 'output-log';
            let prefix = '> ';
            
            if (type === 'error') {
                className = 'output-error';
                prefix = '❌ ';
            } else if (type === 'info') {
                className = 'output-info';
                prefix = 'ℹ ';
            }

            const line = `<span class="${className}">${prefix}${message}</span>`;
            outputLines.push(line);
            output.innerHTML = outputLines.join('\n');
            output.scrollTop = output.scrollHeight;
        }

        console.log = function(...args) {
            originalLog(...args);
            addOutput(args.map(arg => {
                if (typeof arg === 'object') {
                    return JSON.stringify(arg, null, 2);
                }
                return String(arg);
            }).join(' '), 'log');
        };

        console.error = function(...args) {
            originalError(...args);
            addOutput(args.join(' '), 'error');
        };

        function runCode(code) {
            try {
                addOutput(`Executing: ${code.trim()}`, 'info');
                const result = eval(code);
                if (result !== undefined) {
                    addOutput(`← ${typeof result === 'object' ? JSON.stringify(result) : result}`, 'log');
                }
            } catch (error) {
                addOutput(`Error: ${error.message}`, 'error');
            }
        }

        runBtn.addEventListener('click', () => {
            const code = codeInput.value.trim();
            if (code) {
                runCode(code);
                codeInput.value = '';
                codeInput.focus();
            }
        });

        codeInput.addEventListener('keypress', (e) => {
            if (e.key === 'Enter') {
                const code = codeInput.value.trim();
                if (code) {
                    runCode(code);
                    codeInput.value = '';
                }
            }
        });

        clearBtn.addEventListener('click', () => {
            outputLines = [];
            output.innerHTML = '';
            addOutput('Console cleared', 'info');
        });

        themeToggle.addEventListener('click', () => {
            document.body.classList.toggle('light-mode');
            themeToggle.textContent = document.body.classList.contains('light-mode') ? '☀️' : '🌙';
            localStorage.setItem('runtide_theme', document.body.classList.contains('light-mode') ? 'light' : 'dark');
        });

        const theme = localStorage.getItem('runtide_theme') || 'dark';
        if (theme === 'light') {
            document.body.classList.add('light-mode');
            themeToggle.textContent = '☀️';
        }

        addOutput('Runtide Console Ready! 🌊', 'info');
    </script>
</body>
</html>
