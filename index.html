<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Runtide - Code Playground</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Fira Code', 'Monaco', monospace;
            background: #1e1e1e;
            color: #e0e0e0;
            height: 100vh;
            overflow: hidden;
        }

        body.light-mode {
            background: #ffffff;
            color: #333;
        }

        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 12px 20px;
            background: #252526;
            border-bottom: 1px solid #3e3e42;
            z-index: 100;
        }

        body.light-mode .header {
            background: #f3f3f3;
            border-bottom-color: #e0e0e0;
        }

        .logo {
            font-size: 1.5rem;
            font-weight: bold;
            color: #00d9ff;
        }

        .controls {
            display: flex;
            gap: 15px;
            align-items: center;
        }
